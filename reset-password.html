<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XAMO - Create New Password</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0d0e11; color: #e3e3e3; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 select-none">

  <div class="w-full max-w-sm bg-[#16171b] border border-[#26282f] p-6 rounded-2xl shadow-2xl space-y-4 text-center">
    
    <div id="icon-container" class="w-14 h-14 rounded-2xl bg-blue-500/10 text-blue-400 flex items-center justify-center text-2xl mx-auto border border-blue-500/20 shadow-lg shadow-blue-500/10">
      <i class="fa-solid fa-key"></i>
    </div>

    <div>
      <h2 id="page-title" class="text-lg font-bold text-slate-100">Create New Password</h2>
      <p id="page-subtitle" class="text-xs text-slate-400 mt-1">Enter your new password below.</p>
    </div>

    <!-- On-Screen Diagnostics Banner -->
    <div id="status-banner" class="text-xs py-2.5 px-3 rounded-xl break-words text-left bg-blue-500/10 border border-blue-500/20 text-blue-400">
      Initializing page...
    </div>

    <form id="reset-form" class="space-y-3 text-left">
      <div>
        <label class="text-[11px] font-semibold text-slate-400 block mb-1">New Password</label>
        <div class="relative flex items-center">
          <input type="password" id="new-password" placeholder="Minimum 6 characters" class="w-full bg-[#0d0e11] border border-[#2c2e35] rounded-xl px-3.5 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500 pr-10" required minlength="6">
          <button type="button" id="toggle-eye-1" class="absolute right-3 text-slate-400 hover:text-blue-400 text-xs p-1">
            <i id="eye-icon-1" class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <div>
        <label class="text-[11px] font-semibold text-slate-400 block mb-1">Confirm New Password</label>
        <div class="relative flex items-center">
          <input type="password" id="confirm-password" placeholder="Re-enter password" class="w-full bg-[#0d0e11] border border-[#2c2e35] rounded-xl px-3.5 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500 pr-10" required minlength="6">
          <button type="button" id="toggle-eye-2" class="absolute right-3 text-slate-400 hover:text-blue-400 text-xs p-1">
            <i id="eye-icon-2" class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs py-2.5 rounded-xl transition-all shadow-md shadow-blue-600/30 flex items-center justify-center gap-2 cursor-pointer mt-2">
        <span id="submit-text">Update Password</span>
      </button>
    </form>

    <div class="pt-2 border-t border-[#26282f]">
      <a href="/" class="text-xs text-slate-400 hover:text-slate-200 transition-colors">
        <i class="fa-solid fa-arrow-left mr-1"></i> Back to Main Chat
      </a>
    </div>
  </div>

  <script>
    // Global Error Catcher: Shows script crashes on-screen
    window.onerror = function (msg, url, line) {
      logStatus("JS Error on line " + line + ": " + msg, "error");
      return false;
    };

    const SUPABASE_URL = "https://vnlhctmxlctsvyhwyvrl.supabase.co";
    // Ensure your real Anon Key from app.js is pasted here:
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZubGhjdG14bGN0c3Z5aHd5dnJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MzE0NzgsImV4cCI6MjEwMzMwNzQ3OH0.uj2A-itY_CPhZDmWgF9TCYXgR5PXMGeGXa7L58DD_3w";

    const banner = document.getElementById('status-banner');
    const form = document.getElementById('reset-form');
    const submitBtn = document.getElementById('submit-btn');
    const submitText = document.getElementById('submit-text');

    function logStatus(msg, type) {
      if (!banner) return;
      banner.textContent = msg;
      if (type === 'error') {
        banner.className = "text-xs py-2.5 px-3 rounded-xl break-words text-left bg-red-500/10 border border-red-500/20 text-red-400 block";
      } else if (type === 'success') {
        banner.className = "text-xs py-2.5 px-3 rounded-xl break-words text-left bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 block";
      } else {
        banner.className = "text-xs py-2.5 px-3 rounded-xl break-words text-left bg-blue-500/10 border border-blue-500/20 text-blue-400 block";
      }
    }

    // Eye toggles
    function setupToggle(btnId, inputId, iconId) {
      const btn = document.getElementById(btnId);
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (!btn || !input || !icon) return;

      btn.onclick = function(e) {
        e.preventDefault();
        if (input.type === 'password') {
          input.type = 'text';
          icon.className = 'fa-solid fa-eye-slash';
        } else {
          input.type = 'password';
          icon.className = 'fa-solid fa-eye';
        }
      };
    }

    setupToggle('toggle-eye-1', 'new-password', 'eye-icon-1');
    setupToggle('toggle-eye-2', 'confirm-password', 'eye-icon-2');

    // Init Supabase
    let supabase = null;
    let recoveryToken = null;

    if (!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes("PASTE_YOUR")) {
      logStatus("Config Error: Paste your real Supabase Anon Key into line 79 of reset-password.html", "error");
    } else {
      try {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        checkSession();
      } catch (e) {
        logStatus("Client Init Error: " + e.message, "error");
      }
    }

    async function checkSession() {
      const hash = window.location.hash.substring(1);
      const query = window.location.search.substring(1);
      const params = new URLSearchParams(hash || query);

      const accessToken = params.get('access_token');
      const refreshToken = params.get('refresh_token');
      const code = params.get('code');

      if (code) {
        logStatus("Exchanging authorization code...", "info");
        const { data, error } = await supabase.auth.exchangeCodeForSession(code);
        if (error) {
          logStatus("Code exchange error: " + error.message, "error");
        } else {
          recoveryToken = data.session?.access_token;
          logStatus("Recovery session verified. Ready to enter new password.", "info");
        }
      } else if (accessToken) {
        recoveryToken = accessToken;
        if (refreshToken) {
          await supabase.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
        }
        logStatus("Token loaded. Ready to enter new password.", "info");
      } else {
        const { data } = await supabase.auth.getSession();
        if (data.session) {
          recoveryToken = data.session.access_token;
          logStatus("Active recovery session found. Ready to update.", "info");
        } else {
          logStatus("Notice: No reset token detected in URL. Please open this page by clicking the link in your email.", "error");
        }
      }
    }

    // Direct Form Submit Handler
    if (form) {
      form.onsubmit = async function(e) {
        e.preventDefault();

        const pass = document.getElementById('new-password').value.trim();
        const confirm = document.getElementById('confirm-password').value.trim();

        if (pass !== confirm) {
          logStatus("Passwords do not match.", "error");
          return;
        }

        if (pass.length < 6) {
          logStatus("Password must be at least 6 characters.", "error");
          return;
        }

        if (!supabase) {
          logStatus("Supabase client not ready.", "error");
          return;
        }

        submitBtn.disabled = true;
        submitText.textContent = "Connecting...";
        logStatus("Sending update request to Supabase...", "info");

        try {
          // Fallback to direct REST call if JS client session failed
          if (recoveryToken) {
            const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
              method: 'PUT',
              headers: {
                'Content-Type': 'application/json',
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${recoveryToken}`
              },
              body: JSON.stringify({ password: pass })
            });

            const result = await res.json();
            if (!res.ok) throw new Error(result.msg || result.error_description || result.message || "Failed to update");
          } else {
            const { error } = await supabase.auth.updateUser({ password: pass });
            if (error) throw error;
          }

          // Visual Success State
          document.getElementById('icon-container').className = "w-14 h-14 rounded-2xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-2xl mx-auto border border-emerald-500/20";
          document.getElementById('icon-container').innerHTML = '<i class="fa-solid fa-check"></i>';
          document.getElementById('page-title').textContent = "Password Updated!";
          document.getElementById('page-subtitle').textContent = "Your password has been changed successfully.";
          logStatus("Success! Your password is updated. Redirecting in 2s...", "success");
          form.classList.add('hidden');

          setTimeout(() => { window.location.href = "/"; }, 2000);

        } catch (err) {
          logStatus("Update Failed: " + err.message, "error");
          submitBtn.disabled = false;
          submitText.textContent = "Update Password";
        }
      };
    }
  </script>
</body>
</html>
