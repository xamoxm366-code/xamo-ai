<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XAMO - Reset Password</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f1012; color: #e3e3e3; }
  </style>
</head>
<body class="h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-sm bg-[#16171b] border border-[#26282f] p-6 rounded-2xl shadow-2xl space-y-4 text-center">
    <div class="w-14 h-14 rounded-2xl bg-blue-500/10 text-blue-400 flex items-center justify-center text-2xl mx-auto border border-blue-500/20">
      <i class="fa-solid fa-key"></i>
    </div>
    
    <div>
      <h2 class="text-base font-bold text-slate-100">Create New Password</h2>
      <p class="text-xs text-slate-400 mt-1">Enter your new password below.</p>
    </div>

    <div id="status-box" class="text-xs py-2.5 px-3 rounded-xl break-words text-left hidden"></div>

    <div class="space-y-3 text-left">
      <div>
        <label class="text-[11px] font-semibold text-slate-400 block mb-1">New Password</label>
        <input type="password" id="new-password" placeholder="At least 6 characters..." class="w-full bg-[#0f1012] border border-[#2c2e35] rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="text-[11px] font-semibold text-slate-400 block mb-1">Confirm New Password</label>
        <input type="password" id="confirm-password" placeholder="Re-enter password..." class="w-full bg-[#0f1012] border border-[#2c2e35] rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
      </div>
      
      <button type="button" id="update-btn" onclick="updatePassword()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs py-2.5 rounded-xl transition-all shadow-md shadow-blue-600/20 flex items-center justify-center gap-2 cursor-pointer">
        <span>Update Password</span>
      </button>
    </div>

    <div class="pt-2 border-t border-[#26282f]">
      <a href="/" class="text-xs text-slate-400 hover:text-slate-200"><i class="fa-solid fa-arrow-left mr-1"></i> Back to Main Chat</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://tyybyhihgjqzntwivtcw.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZubGhjdG14bGN0c3Z5aHd5dnJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MzE0NzgsImV4cCI6MjEwMzMwNzQ3OH0.uj2A-itY_CPhZDmWgF9TCYXgR5PXMGeGXa7L58DD_3w";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showStatus(msg, type) {
      const box = document.getElementById("status-box");
      box.textContent = msg;
      box.classList.remove("hidden");
      if (type === "error") {
        box.className = "text-xs text-red-400 bg-red-500/10 border border-red-500/20 py-2.5 px-3 rounded-xl block text-left";
      } else {
        box.className = "text-xs text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 py-2.5 px-3 rounded-xl block text-left";
      }
    }

    // Capture the recovery token hash from Supabase when the page loads
    window.addEventListener("DOMContentLoaded", async () => {
      const hash = window.location.hash;
      if (hash && hash.includes("access_token")) {
        const params = new URLSearchParams(hash.substring(1));
        const accessToken = params.get("access_token");
        const refreshToken = params.get("refresh_token");

        if (accessToken && refreshToken) {
          await supabaseClient.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });
        }
      }
    });

    async function updatePassword() {
      const p1 = document.getElementById("new-password").value.trim();
      const p2 = document.getElementById("confirm-password").value.trim();
      const btn = document.getElementById("update-btn");

      if (!p1 || p1.length < 6) {
        showStatus("Password must be at least 6 characters long.", "error");
        return;
      }

      if (p1 !== p2) {
        showStatus("Passwords do not match.", "error");
        return;
      }

      btn.disabled = true;
      btn.querySelector("span").textContent = "Updating...";

      try {
        const { error } = await supabaseClient.auth.updateUser({ password: p1 });

        if (error) throw error;

        showStatus("Password updated successfully! Redirecting...", "success");
        setTimeout(() => {
          window.location.href = "/";
        }, 2000);

      } catch (err) {
        showStatus(err.message || "Failed to update password. Link may have expired.", "error");
        btn.disabled = false;
        btn.querySelector("span").textContent = "Update Password";
      }
    }
  </script>
</body>
</html>
