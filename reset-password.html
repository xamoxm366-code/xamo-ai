<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XAMO - Create New Password</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0d0e11; color: #e3e3e3; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 select-none">

  <div class="w-full max-w-sm bg-[#16171b] border border-[#26282f] p-6 rounded-2xl shadow-2xl space-y-4 text-center">
    
    <div id="icon-container" class="w-14 h-14 rounded-2xl bg-blue-500/10 text-blue-400 flex items-center justify-center text-2xl mx-auto border border-blue-500/20 shadow-lg shadow-blue-500/10">
      <i class="fa-solid fa-key"></i>
    </div>

    <div>
      <h2 id="page-title" class="text-lg font-bold text-slate-100">Create New Password</h2>
      <p id="page-subtitle" class="text-xs text-slate-400 mt-1">Enter your new password below.</p>
    </div>

    <!-- Status Alert Banner -->
    <div id="status-banner" class="hidden text-xs py-2.5 px-3 rounded-xl break-words text-left"></div>

    <form id="reset-form" class="space-y-3 text-left">
      <div>
        <label class="text-[11px] font-semibold text-slate-400 block mb-1">New Password</label>
        <div class="relative flex items-center">
          <input type="password" id="new-password" placeholder="Minimum 6 characters" class="w-full bg-[#0d0e11] border border-[#2c2e35] rounded-xl px-3.5 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500 pr-10" required minlength="6">
          <button type="button" id="toggle-eye-1" class="absolute right-3 text-slate-400 hover:text-blue-400 text-xs p-1">
            <i id="eye-icon-1" class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <div>
        <label class="text-[11px] font-semibold text-slate-400 block mb-1">Confirm New Password</label>
        <div class="relative flex items-center">
          <input type="password" id="confirm-password" placeholder="Re-enter password" class="w-full bg-[#0d0e11] border border-[#2c2e35] rounded-xl px-3.5 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500 pr-10" required minlength="6">
          <button type="button" id="toggle-eye-2" class="absolute right-3 text-slate-400 hover:text-blue-400 text-xs p-1">
            <i id="eye-icon-2" class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs py-2.5 rounded-xl transition-all shadow-md shadow-blue-600/30 flex items-center justify-center gap-2 cursor-pointer mt-2">
        <span id="submit-text">Update Password</span>
      </button>
    </form>

    <div class="pt-2 border-t border-[#26282f]">
      <a href="/" class="text-xs text-slate-400 hover:text-slate-200 transition-colors">
        <i class="fa-solid fa-arrow-left mr-1"></i> Back to Main Chat
      </a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://vnlhctmxlctsvyhwyvrl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZubGhjdG14bGN0c3Z5aHd5dnJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MzE0NzgsImV4cCI6MjEwMzMwNzQ3OH0.uj2A-itY_CPhZDmWgF9TCYXgR5PXMGeGXa7L58DD_3w";

    // 1. Eye Button Logic
    document.getElementById('toggle-eye-1').onclick = function() {
      const input = document.getElementById('new-password');
      const icon = document.getElementById('eye-icon-1');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    };

    document.getElementById('toggle-eye-2').onclick = function() {
      const input = document.getElementById('confirm-password');
      const icon = document.getElementById('eye-icon-2');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    };

    // 2. Status Display
    const banner = document.getElementById('status-banner');
    function setBanner(msg, isError) {
      banner.textContent = msg;
      banner.classList.remove('hidden');
      banner.className = isError
        ? "text-xs py-2.5 px-3 rounded-xl break-words text-left bg-red-500/10 border border-red-500/20 text-red-400 block"
        : "text-xs py-2.5 px-3 rounded-xl break-words text-left bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 block";
    }

    // 3. Initialize Supabase
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 4. Form Submission
    document.getElementById('reset-form').onsubmit = async function(e) {
      e.preventDefault();
      
      const newPass = document.getElementById('new-password').value.trim();
      const confirmPass = document.getElementById('confirm-password').value.trim();
      const btn = document.getElementById('submit-btn');
      const btnText = document.getElementById('submit-text');

      if (newPass !== confirmPass) {
        setBanner("Passwords do not match.", true);
        return;
      }

      if (newPass.length < 6) {
        setBanner("Password must be at least 6 characters.", true);
        return;
      }

      btn.disabled = true;
      btnText.textContent = "Updating...";

      try {
        const { data, error } = await supabase.auth.updateUser({
          password: newPass
        });

        if (error) throw error;

        document.getElementById('icon-container').className = "w-14 h-14 rounded-2xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-2xl mx-auto border border-emerald-500/20";
        document.getElementById('icon-container').innerHTML = '<i class="fa-solid fa-check"></i>';
        document.getElementById('page-title').textContent = "Password Updated!";
        document.getElementById('page-subtitle').textContent = "Your password has been changed successfully.";
        
        setBanner("Success! Redirecting to login...", false);
        document.getElementById('reset-form').classList.add('hidden');

        setTimeout(() => {
          window.location.href = "/";
        }, 1500);

      } catch (err) {
        setBanner("Error: " + err.message, true);
        btn.disabled = false;
        btnText.textContent = "Update Password";
      }
    };
  </script>
</body>
</html>
