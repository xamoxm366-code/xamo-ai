<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XAMO - Create New Password</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f1012; color: #e3e3e3; }
    code, pre { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 select-none">

  <div class="w-full max-w-sm bg-[#16171b] border border-[#26282f] p-6 rounded-2xl shadow-2xl space-y-5 text-center">
    
    <!-- Lock Icon -->
    <div class="w-14 h-14 rounded-2xl bg-blue-500/10 text-blue-400 flex items-center justify-center text-2xl mx-auto border border-blue-500/20 shadow-lg shadow-blue-500/10">
      <i class="fa-solid fa-key"></i>
    </div>

    <div>
      <h2 class="text-lg font-bold text-slate-100">Create New Password</h2>
      <p class="text-xs text-slate-400 mt-1">Enter your new password for your XAMO account.</p>
    </div>

    <!-- Status / Error Banner -->
    <div id="status-banner" class="hidden text-xs py-2.5 px-3 rounded-xl break-words text-left"></div>

    <form id="reset-password-form" class="space-y-3 text-left">
      <div>
        <label class="text-[11px] font-semibold text-slate-400 block mb-1">New Password</label>
        <div class="relative flex items-center">
          <input type="password" id="new-password" placeholder="Minimum 6 characters" class="w-full bg-[#0f1012] border border-[#2c2e35] rounded-xl px-3.5 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500 pr-10" required minlength="6">
          <button type="button" onclick="toggleVisibility('new-password', 'eye-icon-1')" class="absolute right-3 text-slate-400 hover:text-blue-400 text-xs focus:outline-none">
            <i id="eye-icon-1" class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <div>
        <label class="text-[11px] font-semibold text-slate-400 block mb-1">Confirm New Password</label>
        <div class="relative flex items-center">
          <input type="password" id="confirm-password" placeholder="Re-enter password" class="w-full bg-[#0f1012] border border-[#2c2e35] rounded-xl px-3.5 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500 pr-10" required minlength="6">
          <button type="button" onclick="toggleVisibility('confirm-password', 'eye-icon-2')" class="absolute right-3 text-slate-400 hover:text-blue-400 text-xs focus:outline-none">
            <i id="eye-icon-2" class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs py-2.5 rounded-xl transition-all shadow-md shadow-blue-600/30 flex items-center justify-center gap-2 cursor-pointer mt-2">
        <span>Update Password</span>
      </button>
    </form>

    <div class="pt-2 border-t border-[#26282f]">
      <a href="/" class="text-xs text-slate-400 hover:text-slate-200 transition-colors">
        <i class="fa-solid fa-arrow-left mr-1"></i> Back to Main Chat
      </a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://vnlhctmxlctsvyhwyvrl.supabase.co";
    const SUPABASE_ANON_KEY = "PASTE_YOUR_FULL_ANON_KEY_HERE";

    let supabase = null;
    try {
      if (typeof window.supabase !== 'undefined' && !SUPABASE_ANON_KEY.includes('PASTE_YOUR')) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {
      console.error(e);
    }

    function showStatus(msg, isError) {
      const banner = document.getElementById('status-banner');
      banner.textContent = msg;
      banner.classList.remove('hidden');
      banner.className = isError
        ? "text-xs text-red-400 bg-red-500/10 border border-red-500/20 py-2.5 px-3 rounded-xl break-words text-left block"
        : "text-xs text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 py-2.5 px-3 rounded-xl break-words text-left block";
    }

    function toggleVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPass = document.getElementById('new-password').value.trim();
      const confirmPass = document.getElementById('confirm-password').value.trim();
      const btn = document.getElementById('submit-btn');

      if (newPass !== confirmPass) {
        showStatus("Passwords do not match.", true);
        return;
      }

      if (newPass.length < 6) {
        showStatus("Password must be at least 6 characters.", true);
        return;
      }

      if (!supabase) {
        showStatus("Supabase client not initialized. Ensure Anon Key is pasted.", true);
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-xs"></i> <span>Updating...</span>';

      try {
        const { error } = await supabase.auth.updateUser({ password: newPass });
        if (error) throw error;

        showStatus("Password updated successfully! Redirecting to XAMO...", false);
        setTimeout(() => {
          window.location.href = "/";
        }, 1500);
      } catch (err) {
        showStatus("Update Failed: " + err.message, true);
        btn.disabled = false;
        btn.innerHTML = '<span>Update Password</span>';
      }
    });
  </script>
</body>
</html>
